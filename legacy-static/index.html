<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lunacat Calendar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="Lunacat calendar app">
      <section class="phone-frame">
        <header class="top-bar">
          <button class="icon-button" type="button" data-open-menu aria-label="Open menu">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
          <div>
            <p class="eyebrow">Today</p>
            <h1>My Calendar</h1>
          </div>
          <button class="avatar-button" type="button" data-open-profile aria-label="Open profile">
            LC
          </button>
        </header>

        <section class="date-hero" aria-labelledby="date-hero-title">
          <div>
            <p class="eyebrow" data-selected-weekday>Wednesday</p>
            <h2 id="date-hero-title" data-selected-date>July 8</h2>
            <p class="hero-copy" data-selected-summary>3 events left today</p>
          </div>
          <button class="primary-fab" type="button" data-open-sheet aria-label="Create event">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
        </section>

        <nav class="month-switcher" aria-label="Month navigation">
          <button class="icon-button small" type="button" data-prev-month aria-label="Previous month">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <strong data-current-month>July 2026</strong>
          <button class="icon-button small" type="button" data-next-month aria-label="Next month">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </nav>

        <section class="calendar-card" aria-label="Monthly calendar">
          <div class="weekday-row" aria-hidden="true">
            <span>Mon</span>
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span>Fri</span>
            <span>Sat</span>
            <span>Sun</span>
          </div>
          <div class="calendar-grid" data-calendar-grid></div>
        </section>

        <section class="agenda-section" aria-labelledby="agenda-title">
          <div class="section-title">
            <div>
              <p class="eyebrow">Schedule</p>
              <h2 id="agenda-title">Upcoming</h2>
            </div>
            <button class="text-button" type="button" data-today-button>Today</button>
          </div>
          <div data-agenda-list></div>
        </section>

        <nav class="bottom-nav" aria-label="Primary">
          <button class="nav-item active" type="button" data-nav-view="calendar" aria-label="Calendar">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M7 3v3M17 3v3M4 9h16M5 5h14v15H5z" />
            </svg>
            <span>Calendar</span>
          </button>
          <button class="nav-item" type="button" data-nav-view="tasks" aria-label="Tasks">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m5 12 4 4L19 6" />
            </svg>
            <span>Tasks</span>
          </button>
          <button class="nav-item" type="button" data-nav-view="stats" aria-label="Insights">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M5 19V9M12 19V5M19 19v-7" />
            </svg>
            <span>Stats</span>
          </button>
        </nav>
      </section>
    </main>

    <div class="sheet-backdrop" data-sheet hidden>
      <section class="event-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="section-title">
          <div>
            <p class="eyebrow" data-sheet-kicker>New</p>
            <h2 id="sheet-title" data-sheet-title>Create event</h2>
          </div>
          <button class="icon-button small" type="button" data-close-sheet aria-label="Close">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <form class="event-form">
          <label>
            <span>Title</span>
            <input type="text" name="title" value="Planning session" required />
          </label>
          <div class="form-grid">
            <label>
              <span>Start</span>
              <input type="time" name="start" value="16:30" required />
            </label>
            <label>
              <span>End</span>
              <input type="time" name="end" value="17:15" required />
            </label>
          </div>
          <label>
            <span>Note</span>
            <input type="text" name="note" value="Discuss next sprint" />
          </label>
          <p class="form-error">End time must be later than start time.</p>
          <button class="save-button" type="submit" data-save-button>Save event</button>
        </form>
      </section>
    </div>

    <div class="sheet-backdrop" data-info-sheet hidden>
      <section class="event-sheet" role="dialog" aria-modal="true" aria-labelledby="info-title">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="section-title">
          <div>
            <p class="eyebrow" data-info-kicker>Mockup</p>
            <h2 id="info-title" data-info-title>Details</h2>
          </div>
          <button class="icon-button small" type="button" data-close-info aria-label="Close">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <div class="info-content" data-info-content></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
